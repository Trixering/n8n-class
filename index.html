<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智價通 - 動態定價儀表板</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --success-color: #4cc9f0;
            --danger-color: #f72585;
            --warning-color: #f8961e;
            --light-bg: #f8f9fa;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --winter-color: #a0d2eb;
            --holiday-color: #e5eaf5;
            --context-primary: #6c63ff;
            --context-secondary: #4a44b5;
            --context-accent: #ff6584;
            --context-bg: linear-gradient(135deg, #f5f7ff 0%, #e6e9ff 100%);
            --context-border: rgba(108, 99, 255, 0.2);
        }

        body {
            background-color: #f5f7fb;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            border-radius: 0 0 20px 20px;
            padding: 1.5rem 0;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
            margin-bottom: 2rem;
        }

        /* 重新設計的環境狀態卡片 */
        .context-card {
            background: var(--context-bg);
            border: 1px solid var(--context-border);
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(108, 99, 255, 0.15);
            overflow: hidden;
            position: relative;
            margin-bottom: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .context-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(108, 99, 255, 0.2);
        }

        .context-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--context-primary), var(--context-accent));
            box-shadow: 0 2px 8px rgba(108, 99, 255, 0.3);
        }

        .context-header {
            padding: 1.5rem 1.75rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(108, 99, 255, 0.1);
            position: relative;
        }

        .context-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--context-secondary);
            margin: 0;
            display: flex;
            align-items: center;
        }

        .context-title i {
            color: var(--context-primary);
            margin-right: 0.75rem;
            background: rgba(108, 99, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(108, 99, 255, 0.15);
        }

        .context-body {
            padding: 1.75rem;
        }

        .context-info {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .context-item {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: flex-start;
        }

        .context-icon-container {
            margin-right: 1rem;
            position: relative;
        }

        .weather-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a0d2eb, #89c2d9);
            color: white;
            font-size: 1.75rem;
            box-shadow: 0 6px 12px rgba(160, 210, 235, 0.4);
            position: relative;
            overflow: hidden;
        }

        .weather-icon::after {
            content: '';
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .holiday-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e5eaf5, #d0bdf4);
            color: #845ef7;
            font-size: 1.75rem;
            box-shadow: 0 6px 12px rgba(229, 234, 245, 0.5);
            position: relative;
            overflow: hidden;
        }

        .holiday-icon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -10px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .context-text {
            flex: 1;
        }

        .context-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .context-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--context-secondary);
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        .context-desc {
            font-size: 0.85rem;
            color: #8e9aaf;
            font-weight: 500;
        }

        .time-section {
            text-align: right;
            padding: 1rem 1.75rem 1.25rem;
            border-top: 1px solid rgba(108, 99, 255, 0.1);
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-time-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .current-time {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--context-primary);
            margin-bottom: 0.25rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(108, 99, 255, 0.1);
        }

        .last-update {
            font-size: 0.85rem;
            color: #6c757d;
            display: flex;
            align-items: center;
        }

        .last-update-label {
            font-weight: 500;
            margin-right: 0.5rem;
        }

        .last-update-time {
            font-weight: 600;
            color: var(--context-secondary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            background: rgba(108, 99, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            color: var(--context-primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        /* 商品表格樣式修正 */
        .product-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .product-table th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            padding: 1rem;
            border-bottom: 2px solid #dee2e6;
            text-align: left;
            font-size: 0.9rem;
        }

        .product-table td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }

        .product-table tbody tr {
            transition: background-color 0.2s ease;
        }

        .product-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .product-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
        }

        .price-diff {
            display: inline-flex;
            align-items: center;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .price-diff.positive {
            color: #dc3545;
            background-color: rgba(40, 167, 69, 0.1);
        }

        .price-diff.negative {
            color: #28a745;
            background-color: rgba(220, 53, 69, 0.1);
        }

        .price-diff.neutral {
            color: #6c757d;
            background-color: rgba(108, 117, 125, 0.1);
        }

        .reason-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .reason-item {
            background-color: #f8f9fa;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #495057;
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .context-info {
                flex-direction: column;
                gap: 1.5rem;
            }

            .context-item {
                min-width: 100%;
            }

            .time-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .current-time-container {
                align-items: flex-start;
            }

            .current-time {
                font-size: 1.5rem;
            }

            .product-table {
                display: block;
                overflow-x: auto;
            }
        }

        /* 其他樣式保持不變 */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .refresh-btn {
            background-color: white;
            color: var(--primary-color);
            border: none;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .big {
            font-size: 3em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- 儀表板標頭 -->
    <header class="dashboard-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="h3 mb-0"><i class="fas fa-chart-line me-2"></i>智價通 - 動態定價儀表板</h1>
                    <p class="mb-0 opacity-75">即時商品價格追蹤與分析</p>
                </div>
                <div class="col-md-6 text-end">
                    <button id="refreshBtn" class="refresh-btn">
                        <i class="fas fa-sync-alt me-2"></i>重整頁面
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- 環境狀態卡片 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card context-card">
                    <div class="context-header">
                        <h2 class="context-title"><i class="fas fa-info-circle"></i>當前環境狀態</h2>
                    </div>
                    <div class="context-body">
                        <div class="context-info">
                            <div class="context-item">
                                <div class="context-icon-container">
                                    <div class="weather-icon">
                                        <i class="fas fa-cloud-sun"></i>
                                    </div>
                                </div>
                                <div class="context-text">
                                    <div class="context-label">天氣狀況</div>
                                    <div class="context-value" id="weatherValue">晴天</div>
                                    <div class="context-desc">天氣良好，戶外商品需求可能增加</div>
                                </div>
                            </div>
                            <div class="context-item">
                                <div class="context-icon-container">
                                    <div class="holiday-icon">
                                        <i class="fas fa-calendar-alt"></i>
                                    </div>
                                </div>
                                <div class="context-text">
                                    <div class="context-label">日期類型</div>
                                    <div class="context-value" id="dateTypeValue">平日</div>
                                    <div class="context-desc">一般購物需求</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="time-section">
                        <div class="current-time-container">
                            <div id="currentTime" class="current-time"></div>
                            <div class="last-update">
                                <span class="last-update-label">最後更新:</span>
                                <span class="last-update-time" id="lastUpdateTime">--:--:--</span>
                            </div>
                        </div>
                        <div class="status-indicator">
                            <div class="status-dot"></div>
                            系統運作正常
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 統計數據 -->
        <div class="row mb-4 big">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h6 class="card-title text-muted">總商品數</h6>
                        <div class="stats-number text-primary" id="totalProducts">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h6 class="card-title text-muted">價格上漲</h6>
                        <div class="stats-number text-danger" id="priceIncreased">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h6 class="card-title text-muted">價格下跌</h6>
                        <div class="stats-number text-success" id="priceDecreased">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h6 class="card-title text-muted">價格不變</h6>
                        <div class="stats-number text-secondary" id="priceUnchanged">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 篩選器 -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title mb-3"><i class="fas fa-filter me-2"></i>價格變動篩選</h6>
                        <div class="filter-buttons">
                            <button class="btn btn-outline-primary active filter-btn" data-filter="all">全部商品</button>
                            <button class="btn btn-outline-danger filter-btn" data-filter="increase">價格上漲</button>
                            <button class="btn btn-outline-success filter-btn" data-filter="decrease">價格下跌</button>
                            <button class="btn btn-outline-secondary filter-btn" data-filter="unchanged">價格不變</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 載入指示器 -->
        <div id="loadingSpinner" class="loading-spinner text-center py-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">載入中...</span>
            </div>
            <p class="mt-2">正在載入商品資料...</p>
        </div>

        <!-- 商品表格 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-boxes me-2"></i>商品價格列表</h5>
                        <div class="table-responsive">
                            <table class="table product-table" id="productsTable">
                                <thead>
                                    <tr>
                                        <th>商品資訊</th>
                                        <th>SKU</th>
                                        <th>原始價格</th>
                                        <th>當前價格</th>
                                        <th>價格變動</th>
                                        <th>變動原因</th>
                                        <th>上次變更時間</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTableBody">
                                    <!-- 商品資料將透過JavaScript動態填入 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全域變數
        let productsData = [];
        let contextData;

        // 天氣與節慶列表
        const weatherList = [
            '晴天', '陰天', '雨天', '強風', '毛毛雨', '下雪',
            '冬天', '酷熱', '颱風', '酷寒'
        ];

        const holidays = [
            { type: '中元節', weight: 25 },
            { type: '平日', weight: 13 },
            { type: '週末', weight: 15 },
            { type: '一般假日', weight: 10 },
            { type: '傳統節慶', weight: 8 },
            { type: '國定假日', weight: 5 },
            { type: '春節', weight: 6 },
            { type: '情人節', weight: 4 },
            { type: '中秋節', weight: 4 },
            { type: '端午節', weight: 3 },
            { type: '七夕', weight: 3 },
            { type: '雙十一', weight: 4 },
            { type: '聖誕節', weight: 3 },
            { type: '跨年', weight: 4 },
            { type: '選舉日', weight: 1 },
            { type: '連續假期', weight: 2 }
        ];

        // DOM 載入完成後執行
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);

            // 載入資料
            loadData();

            // 綁定重整按鈕事件
            document.getElementById('refreshBtn').addEventListener('click', loadData);

            // 綁定篩選按鈕事件
            document.querySelectorAll('.filter-btn').forEach(button => {
                button.addEventListener('click', function () {
                    // 移除所有按鈕的active類別
                    document.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    // 為當前按鈕添加active類別
                    this.classList.add('active');

                    // 篩選商品
                    filterProducts(this.dataset.filter);
                });
            });
        });

        // 更新當前時間
        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // 載入資料
        async function loadData() {
            showLoading(true);

            try {
                // 更新最後更新時間
                document.getElementById('lastUpdateTime').textContent =
                    new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                // 同時獲取商品資料和環境狀態
                const [productsResponse, contextResponse] = await Promise.all([
                    fetch('https://69038c84d0f10a340b24d787.mockapi.io/products'),
                    fetch('https://69038c84d0f10a340b24d787.mockapi.io/state/1')
                ]);

                if (!productsResponse.ok || !contextResponse.ok) {
                    throw new Error('資料獲取失敗');
                }

                productsData = await productsResponse.json();
                contextData = await contextResponse.json();

                // 更新環境狀態顯示
                updateContextDisplay();

                // 渲染商品表格
                renderProductsTable();

                // 更新統計數據
                updateStats();

            } catch (error) {
                console.error('載入資料時發生錯誤:', error);
                alert('無法載入資料，請稍後再試');
            } finally {
                showLoading(false);
            }
        }

        // 更新環境狀態顯示
        function updateContextDisplay() {
            // 使用API資料或隨機選擇
            const weatherValue = contextData.weather || getRandomWeather();
            const dateTypeValue = contextData.datetype || getRandomHoliday();

            document.getElementById('weatherValue').textContent = weatherValue;
            document.getElementById('dateTypeValue').textContent = dateTypeValue;

            // 根據天氣和節日更新描述
            updateContextDescription(weatherValue, dateTypeValue);
        }

        // 隨機選擇天氣
        function getRandomWeather() {
            const randomIndex = Math.floor(Math.random() * weatherList.length);
            return weatherList[randomIndex];
        }

        // 根據權重隨機選擇節日
        function getRandomHoliday() {
            // 計算總權重
            const totalWeight = holidays.reduce((sum, item) => sum + item.weight, 0);

            // 生成隨機數
            let random = Math.random() * totalWeight;

            // 根據權重選擇
            for (const item of holidays) {
                random -= item.weight;
                if (random <= 0) {
                    return item.type;
                }
            }

            return '平日';
        }

        // 根據天氣和節日更新描述
        function updateContextDescription(weather, holiday) {
            const weatherDesc = document.querySelector('.context-item:nth-child(1) .context-desc');
            const holidayDesc = document.querySelector('.context-item:nth-child(2) .context-desc');

            // 天氣描述
            const weatherDescriptions = {
                '晴天': '天氣良好，戶外商品需求可能增加',
                '陰天': '天氣陰沉，可能影響購物心情',
                '雨天': '下雨天，雨具和室內商品需求增加',
                '強風': '風力強勁，戶外活動減少',
                '毛毛雨': '小雨天氣，對購物影響較小',
                '下雪': '雪天，保暖商品需求增加',
                '冬天': '冬季寒冷，保暖商品需求增加',
                '酷熱': '天氣炎熱，清涼商品需求增加',
                '颱風': '惡劣天氣，整體購物需求下降',
                '酷寒': '極度寒冷，保暖商品需求大增'
            };

            weatherDesc.textContent = weatherDescriptions[weather] || '天氣狀況對購物影響一般';

            // 節日描述
            const holidayDescriptions = {
                '中元節': '祭祀用品需求增加',
                '平日': '一般購物需求',
                '週末': '週末購物需求增加',
                '一般假日': '假日購物需求增加',
                '傳統節慶': '傳統節日相關商品需求增加',
                '國定假日': '假日購物需求增加',
                '春節': '年節商品需求大增',
                '情人節': '禮品和浪漫商品需求增加',
                '中秋節': '月餅和烤肉用品需求增加',
                '端午節': '粽子及節慶食品需求增加',
                '七夕': '浪漫禮品需求增加',
                '雙十一': '電商促銷，整體購物需求大增',
                '聖誕節': '禮品和節慶裝飾需求增加',
                '跨年': '派對用品和慶祝商品需求增加',
                '選舉日': '政治相關商品需求增加',
                '連續假期': '旅遊和休閒商品需求增加'
            };

            holidayDesc.textContent = holidayDescriptions[holiday] || '一般購物需求';
        }

        // 渲染商品表格
        function renderProductsTable(filter = 'all') {
            const tableBody = document.getElementById('productsTableBody');
            tableBody.innerHTML = '';

            // 根據篩選條件過濾商品
            let filteredProducts = productsData;
            if (filter !== 'all') {
                filteredProducts = productsData.filter(product => {
                    if (filter === 'increase') return product.isChanged && product.priceDiff > 0;
                    if (filter === 'decrease') return product.isChanged && product.priceDiff < 0;
                    if (filter === 'unchanged') return !product.isChanged || product.priceDiff === 0;
                    return true;
                });
            }

            // 如果沒有商品資料
            if (filteredProducts.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="fas fa-box-open fa-2x mb-2"></i>
                            <p>暫無商品資料</p>
                        </td>
                    </tr>
                `;
                return;
            }

            // 渲染商品資料
            filteredProducts.forEach(product => {
                const row = document.createElement('tr');

                // 計算當前價格
                const currentPrice = product.basePrice - (product.priceDiff || 0);

                // 決定價格變動的樣式
                let priceChangeClass = 'neutral';
                let priceChangeIcon = '';

                if (product.isChanged && product.priceDiff > 0) {
                    priceChangeClass = 'positive';
                    priceChangeIcon = '<i class="fas fa-arrow-up me-1"></i>';
                } else if (product.isChanged && product.priceDiff < 0) {
                    priceChangeClass = 'negative';
                    priceChangeIcon = '<i class="fas fa-arrow-down me-1"></i>';
                }

                // 處理變動原因 - 以逗號分割並去除空格
                let reasonItems = [];
                if (product.reason) {
                    reasonItems = product.reason.split(',').map(item => item.trim());
                }

                // 格式化日期 - 使用隨機日期作為上次變更時間
                // product.daysSinceLastSale 格式:2025-10-31T02:17:00.727Z
                const lastChangeDate = new Date(product.daysSinceLastSale);
                const formattedDate = lastChangeDate.toLocaleDateString('zh-TW');

                row.innerHTML = `
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="product-img me-3">
                                <i class="fas fa-box"></i>
                            </div>
                            <div>
                                <div class="fw-bold">${product.productName}</div>
                                <small class="text-muted">ID: ${product.id}</small>
                            </div>
                        </div>
                    </td>
                    <td>${product.sku}</td>
                    <td>$${currentPrice}</td>
                    <td class="fw-bold">$${product.basePrice}</td>
                    <td>
                        <span class="price-diff ${priceChangeClass}">
                            ${priceChangeIcon}${product.priceDiff > 0 ? '+' : ''}${product.priceDiff || 0}
                        </span>
                    </td>
                    <td>
                        ${reasonItems.length > 0 ?
                        `<div class="reason-list">
                                ${reasonItems.map(item => `<div class="reason-item">${item}</div>`).join('')}
                            </div>` :
                        '無調整原因'
                    }
                    </td>
                    <td>${formattedDate}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        // 更新統計數據
        function updateStats() {
            // 總商品數
            document.getElementById('totalProducts').textContent = productsData.length;

            // 價格上漲數量
            const increasedCount = productsData.filter(product =>
                product.isChanged && product.priceDiff > 0
            ).length;
            document.getElementById('priceIncreased').textContent = increasedCount;

            // 價格下跌數量
            const decreasedCount = productsData.filter(product =>
                product.isChanged && product.priceDiff < 0
            ).length;
            document.getElementById('priceDecreased').textContent = decreasedCount;

            // 價格不變數量
            const unchangedCount = productsData.filter(product =>
                !product.isChanged || product.priceDiff === 0
            ).length;
            document.getElementById('priceUnchanged').textContent = unchangedCount;
        }

        // 篩選商品
        function filterProducts(filter) {
            renderProductsTable(filter);
        }

        // 顯示/隱藏載入指示器
        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }
    </script>
</body>

</html>
